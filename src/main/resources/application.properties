spring.application.name=pet-clinic-search-demo

# H2 keeps the project runnable without installing a database. Use the postgres profile for PostgreSQL.
spring.datasource.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=never
