spring.application.name=pet-clinic-search-demo

# H2 keeps the project runnable without installing a database. Use the postgres profile for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petclinic}
spring.datasource.username=${DB_USERNAME:petclinic}
spring.datasource.password=${DB_PASSWORD:petclinic}
spring.elasticsearch.uris=${ELASTICSEARCH_URI:http://localhost:9200}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=never
